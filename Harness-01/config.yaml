# M2 - Model config
# Code asks for a profile, never a model tag. Change models here.
# Pick profiles from your Session 1 benchmark results.
# Profiles per DEV_AGENT_LOOP.md: fast = deepseek-r1:1.5b, reasoning/fallback = qwen3:4b.

runtime:
  base_url: http://localhost:11434
  api: native            # native = Ollama /api/chat ; openai = /v1/chat/completions
  timeout_s: 300

profiles:
  fast:
    model: deepseek-r1:1.5b
    temperature: 0
    num_ctx: 8192
    num_predict: 512
    keep_alive: 10m
    think: false         # reasoning off: faster, cleaner JSON

  reasoning:
    model: qwen3:4b
    temperature: 0
    num_ctx: 16384
    num_predict: 2048
    keep_alive: 10m
    think: false

  fallback:
    model: qwen3:4b
    temperature: 0
    num_ctx: 8192
    num_predict: 4096
    keep_alive: 10m
    think: true          # escalation: reasoning on (thinking tokens count toward num_predict)

logging:
  file: logs/session3_calls.jsonl   # Session 2 runs: logs/session2_calls.jsonl
